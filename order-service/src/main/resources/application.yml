spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5432/orders
    username: orders
    password: orders
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8080/auth/.well-known/jwks.json

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: http://localhost:4318/v1/traces

security:
  rate-limit:
    max-requests: 50
    window-seconds: 10

external:
  customer:
    base-url: http://localhost:8080
  catalog:
    base-url: http://localhost:8080
  payment-gateway:
    base-url: http://localhost:8080
  notification:
    base-url: http://localhost:8080

spring.mvc:
  problemdetails:
    enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs

resilience4j:
  circuitbreaker:
    instances:
      paymentGateway:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        registerHealthIndicator: true
      customerService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        registerHealthIndicator: true
      catalogService:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        registerHealthIndicator: true
  retry:
    instances:
      paymentGateway:
        maxAttempts: 3
        waitDuration: 200ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        retryExceptions:
          - com.ecommerce.orders.application.exception.ExternalServiceException
          - org.springframework.web.client.ResourceAccessException
      customerService:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - com.ecommerce.orders.application.exception.ExternalServiceException
          - org.springframework.web.client.ResourceAccessException
      catalogService:
        maxAttempts: 2
        waitDuration: 200ms
        retryExceptions:
          - com.ecommerce.orders.application.exception.ExternalServiceException
          - org.springframework.web.client.ResourceAccessException
